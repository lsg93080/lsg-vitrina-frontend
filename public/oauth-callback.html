<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OAuth Callback - LifeSync Games</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1a1a1a;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 360px;
      width: 100%;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #FA5E15;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Success icon */
    .icon-success {
      display: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #22c55e;
      margin: 0 auto 1.25rem;
      align-items: center;
      justify-content: center;
    }

    .icon-success svg {
      width: 28px;
      height: 28px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Error icon */
    .icon-error {
      display: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #ef4444;
      margin: 0 auto 1.25rem;
      align-items: center;
      justify-content: center;
    }

    .icon-error svg {
      width: 28px;
      height: 28px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      line-height: 1.5;
    }

    .error-message {
      display: none;
      font-size: 0.875rem;
      color: #ef4444;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-top: 1rem;
      text-align: left;
      word-break: break-word;
    }

    .btn-close {
      display: none;
      margin-top: 1.25rem;
      padding: 0.625rem 1.5rem;
      background: #FA5E15;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-close:hover {
      background: #e04d0a;
    }

    /* No-opener fallback */
    .no-opener {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container" id="app">
    <!-- Loading state -->
    <div class="spinner" id="spinner"></div>

    <!-- Success icon -->
    <div class="icon-success" id="iconSuccess">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <!-- Error icon -->
    <div class="icon-error" id="iconError">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>

    <p class="title" id="title">Authenticating&hellip;</p>
    <p class="subtitle" id="subtitle">Please wait while we complete the connection.</p>

    <div class="error-message" id="errorMessage"></div>

    <button class="btn-close" id="btnClose" onclick="window.close()">Close</button>

    <!-- Fallback when there is no opener (user navigated here directly) -->
    <div class="no-opener" id="noOpener">
      <p class="title">Authentication complete.</p>
      <p class="subtitle">You can close this window.</p>
      <button class="btn-close" style="display:inline-block; margin-top:1.25rem;" onclick="window.close()">Close
        window</button>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var success = params.get('success') === 'true';
      var provider = params.get('provider') || 'gitlab';
      var errorMsg = params.get('error') || 'Unknown error';
      var newConnection = params.get('new_connection') === 'true';

      var spinner = document.getElementById('spinner');
      var iconSuccess = document.getElementById('iconSuccess');
      var iconError = document.getElementById('iconError');
      var titleEl = document.getElementById('title');
      var subtitleEl = document.getElementById('subtitle');
      var errorMsgEl = document.getElementById('errorMessage');
      var btnClose = document.getElementById('btnClose');
      var noOpenerEl = document.getElementById('noOpener');

      function showSuccess() {
        spinner.style.display = 'none';
        iconSuccess.style.display = 'flex';
        titleEl.textContent = 'Connected successfully!';
        subtitleEl.textContent = 'Closing window\u2026';
      }

      function showError(msg) {
        spinner.style.display = 'none';
        iconError.style.display = 'flex';
        titleEl.textContent = 'Connection failed';
        subtitleEl.textContent = 'An error occurred during authentication.';
        errorMsgEl.textContent = msg;
        errorMsgEl.style.display = 'block';
        btnClose.style.display = 'inline-block';
      }

      // Send result to the parent window via BroadcastChannel (works even when
      // window.opener is lost due to cross-origin redirects) or postMessage as fallback.
      var message;
      if (success) {
        showSuccess();
        message = { type: 'oauth_success', provider: provider, newConnection: newConnection };
      } else {
        showError(errorMsg);
        message = { type: 'oauth_error', provider: provider, error: errorMsg };
      }

      // BroadcastChannel: works across tabs/popups on the same origin
      var channel = new BroadcastChannel('oauth_channel');
      channel.postMessage(message);
      channel.close();

      // Fallback: postMessage if opener is still available
      if (window.opener) {
        window.opener.postMessage(message, window.location.origin);
      }

      if (success) {
        setTimeout(function () { window.close(); }, 800);
      }
    })();
  </script>
</body>

</html>
