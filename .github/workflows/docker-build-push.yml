# ========================================================
# WORKFLOW: BUILD Y PUSH DE IMAGEN DOCKER
# Descripción: Construye y publica una imagen en Docker Hub cuando se realizan cambios en el repositorio.
# NOTA: este frontend hornea las VITE_* en build time (ver Dockerfile ARG),
# por eso se pasan como --build-arg apuntando al dominio de DIINF.
# Las VITE_FIREBASE_* van hardcodeadas (no como GH secret): son API keys de
# cliente Firebase, pensadas para ser públicas y restringidas por dominio
# autorizado en la consola de Firebase, no por secretismo.
# ========================================================
name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el código fuente del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Configurar Docker Buildx para construir imágenes
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Paso 3: Iniciar sesión en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Paso 4: Construir y publicar la imagen Docker
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: lsg93080/vitrina-frontend:latest
          build-args: |
            VITE_API_URL=https://vitrina.diinf.usach.cl/vitrina/api/v1
            VITE_AUTH_SERVICE_URL=https://vitrina.diinf.usach.cl/auth/api/v1
            VITE_CLOUD_MODULE_URL=https://vitrina.diinf.usach.cl/cloud/
            VITE_HOST_URL=https://vitrina.diinf.usach.cl/home/
            VITE_FIREBASE_API_KEY=AIzaSyBQMvGjZMXESYUzYWFpw_gWMxG3cHWODgM
            VITE_FIREBASE_AUTH_DOMAIN=lsg-platform.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=lsg-platform
            VITE_FIREBASE_STORAGE_BUCKET=lsg-platform.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=666028254953
            VITE_FIREBASE_APP_ID=1:666028254953:web:a94dab6bedb99b2272f278

          # NOTAS SOBRE LAS ETIQUETAS:
          # - "latest": Siempre apunta a la última versión publicada.
          # - "${{ github.sha }}": Permite identificar la imagen exacta basada en el commit.
          # - "v1.0.0": Puedes usar un esquema de versionamiento semántico (major.minor.patch).
